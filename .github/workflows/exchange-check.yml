name: exchange-check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    env:
      JFROG_URL: ${{ secrets.JFROG_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Exchange GitHub OIDC token and run lab checks
        run: python3 scripts/ci_exchange.py
